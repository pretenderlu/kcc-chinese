name: Build KCC 汉化版

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]   # 打 tag 时自动发布 Release

permissions:
  contents: write    # 发布 Release 需要

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 检出本仓库（补丁）
        uses: actions/checkout@v4
        with:
          path: patch

      - name: 检出 KCC 上游源码
        uses: actions/checkout@v4
        with:
          repository: ciromattia/kcc
          ref: v11.0.3            # 与 strings_zh.json 的 kcc_version 保持一致
          path: kcc

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'  # KCC 依赖 PySide6<6.10，不支持 3.14

      - name: 打汉化补丁
        run: python patch\patch_cn.py --dir kcc

      - name: 安装依赖并打包
        working-directory: kcc
        run: |
          pip install -r requirements.txt pyinstaller
          python -m PyInstaller --clean -y kcc.spec

      - name: 重命名产物
        run: Move-Item kcc\dist\kcc.exe kcc\dist\KCC-v11.0.3-zh_CN-windows.exe

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: KCC-zh_CN-windows
          path: kcc/dist/KCC-v11.0.3-zh_CN-windows.exe

  build-macos:
    strategy:
      matrix:
        include:
          - os: macos-14          # Apple Silicon (arm64)
            arch: arm64
          - os: macos-15-intel    # Intel
            arch: intel
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - name: 检出本仓库（补丁）
        uses: actions/checkout@v4
        with:
          path: patch

      - name: 检出 KCC 上游源码
        uses: actions/checkout@v4
        with:
          repository: ciromattia/kcc
          ref: v11.0.3            # 与 strings_zh.json 的 kcc_version 保持一致
          path: kcc

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 打汉化补丁
        run: python patch/patch_cn.py --dir kcc

      - name: 安装依赖
        working-directory: kcc
        run: |
          python -m pip install --upgrade pip pyinstaller certifi
          pip install -r requirements.txt

      - name: 安装 appdmg（dmg 打包工具）
        run: npm install -g appdmg

      - name: 打包 .app 并制作 dmg
        working-directory: kcc
        run: python setup.py build_binary

      - name: 重命名产物
        run: |
          cd kcc/dist
          for f in *.dmg; do mv "$f" "KCC-v11.0.3-zh_CN-macos-${{ matrix.arch }}.dmg"; done

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: KCC-zh_CN-macos-${{ matrix.arch }}
          path: kcc/dist/KCC-v11.0.3-zh_CN-macos-${{ matrix.arch }}.dmg

  release:
    needs: [ build-windows, build-macos ]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: KCC-zh_CN-*
          merge-multiple: true

      # tag 格式约定为 vX.Y.Z-zh，由此推导出上游版本 tag vX.Y.Z，
      # 抓取上游官方发布说明原文附在 Release 里
      - name: 生成 Release 说明（自动附上游更新内容）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VER="${REF_NAME%-zh}"
          cat > notes.md <<EOF
          KCC ${VER} 简体中文汉化版。仅翻译界面文本，功能与上游官方版完全一致。

          ## 下载说明

          - **Windows**：KCC-${VER}-zh_CN-windows.exe，下载即用，无需安装 Python
          - **macOS**：Apple Silicon 选 KCC-${VER}-zh_CN-macos-arm64.dmg，Intel 选 KCC-${VER}-zh_CN-macos-intel.dmg；未做 Apple 签名/公证，首次打开需**右键 → 打开**（与上游官方包相同）
          - 输出 **MOBI** 需另行安装 kindlegen；源文件为 **CBR/RAR** 需安装 7-Zip（EPUB/CBZ/KPF 与 ZIP/图片/PDF 均不需要）

          ## 汉化说明

          基于上游 [KCC ${VER}](https://github.com/ciromattia/kcc/releases/tag/${VER}) 制作，共翻译 250 余处界面文本。补丁与使用说明见仓库主页。
          EOF
          UP_BODY=$(gh api "repos/ciromattia/kcc/releases/tags/${VER}" --jq .body 2>/dev/null) || UP_BODY=""
          if [ -n "$UP_BODY" ]; then
            {
              echo
              echo "## 上游更新内容（${VER}，官方原文）"
              echo
              echo "$UP_BODY"
            } >> notes.md
          else
            {
              echo
              echo "## 上游更新内容"
              echo
              echo "未能自动获取上游发布说明，请见 https://github.com/ciromattia/kcc/releases/tag/${VER}"
            } >> notes.md
          fi

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          name: KCC 汉化版 ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*
